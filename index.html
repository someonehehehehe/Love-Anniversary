<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>A Year of Us ❤️</title>
<link href="https://fonts.googleapis.com/css2?family=Itim&family=Nunito:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">

<style>
:root{
  --paper:#f6ecdd;--blush:#e9c5c2;--rose:#c4808a;
  --wine:#7a2338;--brown:#5b4236;--ink:#4a362c;
  --hand:"Itim","Gaegu","Comic Sans MS",cursive;
  --body:"Nunito",Georgia,serif;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--paper);color:var(--ink);font:17px/1.65 var(--body);overflow-x:hidden}
h2{font:400 2.2rem var(--hand);color:var(--wine);margin:0 0 12px}
h3{font:400 1.5rem var(--hand);margin:8px 0}
button{font:inherit;cursor:pointer;color:inherit}
body{font-synthesis:none}
b,strong,h1,h2,h3,h4{font-weight:400}
b{color:var(--wine)}
button:focus-visible{outline:3px solid var(--wine);outline-offset:3px}
.hidden{display:none!important}
#bar{position:fixed;top:0;left:0;height:4px;background:var(--rose);z-index:100;width:0}
#gate{min-height:100vh;display:flex;align-items:center;justify-content:center;text-align:center;padding:24px}
.greet{font:400 2.3rem var(--hand);color:var(--wine)}
.btn{background:var(--wine);color:#fff7ef;border:0;padding:10px 20px;border-radius:5px 12px;font:1.2rem var(--hand);margin:5px}
.ghost{background:transparent;color:var(--wine);border:1px dashed var(--wine)}
section{max-width:1100px;margin:0 auto;padding:65px 24px 25px;scroll-margin-top:25px}
.sub{display:block;position:relative;margin:12px 0 24px;line-height:1.6;font-style:italic}
.ew{width:min(340px,100%);margin:20px auto}
.ew.big{width:min(430px,100%)}
.env{position:relative;width:100%;height:150px;border:0;background:linear-gradient(var(--blush),#dcaeb0);box-shadow:3px 5px #5b423622}
.big .env{height:190px}
.flap{position:absolute;inset:0 0 auto;height:62%;background:#d79ea5;clip-path:polygon(0 0,100% 0,50% 100%);transform-origin:top;transition:transform .65s;z-index:2}
.env.open .flap{transform:rotateX(180deg)}
.seal{position:absolute;left:50%;top:48%;border-radius:50%;background:var(--wine);color:white;padding:5px 10px;transform:translateX(-50%);z-index:3}
.env.open .seal{opacity:0}
.lab{position:absolute;bottom:10px;left:0;width:100%;font:1.3rem var(--hand)}
.note{display:grid;grid-template-rows:0fr;transition:grid-template-rows .5s}
.env.open+.note{grid-template-rows:1fr}
.note>div{overflow:hidden;min-height:0}
.paper{margin-top:10px;padding:20px;background:#fffaf0 repeating-linear-gradient(transparent 0 29px,#c4808a33 29px 30px);font:1.3rem/30px var(--hand);white-space:pre-line;box-shadow:2px 3px #5b423622}
.note .paper{opacity:0;transition:opacity .4s}
.env.open+.note .paper{opacity:1}
.sig{text-align:right;color:var(--wine);display:block}
.tl{border-left:2px dashed var(--rose);padding-left:22px;margin-left:4px}
.ms{position:relative;margin-bottom:30px;padding:15px;background:#fffaf0;box-shadow:2px 4px #5b423622}
.ms:before{content:"♥";position:absolute;left:-29px;color:var(--wine)}
.ms.small{max-width:370px;background:#fff3b8;transform:rotate(-.5deg)}
.date{font:.95rem var(--hand);color:var(--rose)}
.story{display:none;margin:10px 0 0;padding:10px 14px;font:1.3rem/1.5 var(--hand);color:var(--brown);background:#fff7ef;border-left:4px solid var(--rose);border-radius:0 14px 14px 0}
.story.show{display:block}

/* PHOTOS: every picture is shown in a portrait frame (landscape photos are cropped, not stretched) */
.pic{display:block;width:min(100%,280px);aspect-ratio:3/4;object-fit:cover;margin:10px 0}
.ms .ph,#gout .ph,#lb .ph{aspect-ratio:3/4;width:min(100%,280px);margin:10px auto}
.ph{display:flex;align-items:center;justify-content:center;text-align:center;min-height:150px;padding:10px;border:2px dashed var(--rose);background:#f3e3d6;font:1rem var(--hand)}
.count{font:1rem var(--hand)}

/* GARDEN BED: every plant sits in normal page flow, so nothing can be cut off or hidden */
#bed{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:22px 8px;padding:24px 12px 16px;margin:20px 0 14px;
 background:linear-gradient(#fbeee8,#f6e2d8);border-radius:14px;box-shadow:inset 0 0 0 2px #e9d6bf}
.plant{display:flex;flex-direction:column;align-items:center;padding:0;border:0;background:none;touch-action:manipulation}
.plant .stage{display:flex;align-items:flex-end;justify-content:center;width:100%;height:150px}
.plant:not(.grown) .stage::after{content:"tap to plant";font:1.1rem var(--hand);color:var(--rose);margin-bottom:14px}
.plant svg{display:block;flex:none;width:75px;height:150px;transform:scale(0);transform-origin:50% 100%;transition:transform .7s cubic-bezier(.3,1.5,.5,1)}
.plant.grown svg{transform:scale(1)}
.plant.grown .stage::after{content:none}
.plant.sel svg{animation:sway 2.4s ease-in-out infinite}
.mound{position:relative;display:block;width:100px;height:32px;margin-top:-6px;background:#8a6248;box-shadow:inset 0 6px 0 #6d4b36;
 border-radius:50px 50px 8px 8px/32px 32px 8px 8px}
.seed{position:absolute;left:50%;top:-7px;width:26px;height:16px;margin-left:-13px;border-radius:50%;background:#4a2e1f;border:2px solid #fff7ef;transition:opacity .3s}
.seed::after{content:"";position:absolute;inset:-9px;border-radius:50%;border:2px dashed var(--rose);animation:ping 1.8s ease-out infinite}
.plant.grown .seed{opacity:0}.plant.grown .seed::after{animation:none}
.plant:hover .mound{background:#9a6f52}
.tag{margin-top:6px;font:1.15rem var(--hand);color:var(--brown)}
.plant.sel .tag{color:var(--wine)}
@keyframes ping{0%{transform:scale(.7);opacity:.9}100%{transform:scale(1.3);opacity:0}}
@keyframes sway{0%,100%{transform:rotate(-3deg)}50%{transform:rotate(3deg)}}
#bed+.count{margin-top:12px}
#gnote{position:relative;min-height:90px;margin:14px 0;padding:18px;border-radius:8px;background:#fffaf0;color:var(--brown);
 font:1.25rem/1.6 var(--hand);white-space:pre-line;box-shadow:2px 3px #5b423622}
#gnote p{margin:5px 0}
#gnote h3{color:var(--wine)}

.giftwrap{text-align:center;min-height:300px;position:relative}
.gift{position:relative;width:170px;height:150px;margin:60px auto 0;border:0;background:none}
.gbody{position:absolute;bottom:0;left:0;right:0;height:100px;background:var(--rose)}
.gbody:after,.glid:after{content:"";position:absolute;left:43%;width:26px;height:100%;background:var(--wine)}
.glid{position:absolute;bottom:100px;left:-8px;right:-8px;height:34px;background:#d58f98;transition:transform .7s}
.glid:before{content:"";position:absolute;left:40%;top:-18px;width:36px;height:20px;border:6px solid var(--wine);border-radius:50%}
.gift.open .glid{transform:translate(-30px,-60px) rotate(-28deg)}
.gtag{font:1.2rem var(--hand);color:var(--wine)}
#gout{max-width:450px;margin:auto}
.alb{display:flex;flex-wrap:wrap;gap:22px;justify-content:center}
.pol{width:190px;background:white;padding:10px;border:0;box-shadow:2px 4px 8px #0003;transition:transform .2s}
.pol img,.pol .ph{height:230px;width:100%;object-fit:cover}
.pol span{display:block;font:1rem var(--hand);margin-top:6px}
#lb{position:fixed;inset:0;background:#3c231ee8;z-index:200;display:flex;align-items:center;justify-content:center;padding:15px}
#lb .in{background:#fffaf0;max-width:520px;width:100%;max-height:92vh;overflow:auto;padding:15px;text-align:center}
#lb img{display:block;margin:0 auto;width:min(100%,340px);aspect-ratio:3/4;max-height:60vh;object-fit:cover}
.row{display:flex;justify-content:space-between;gap:5px}
.scraps{display:flex;flex-wrap:wrap;gap:10px;justify-content:center}
.scrap{border:0;padding:12px;font:1.2rem var(--hand);box-shadow:2px 2px #0002}
.scrap.on{outline:2px solid var(--wine)}
.ow{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(230px,100%),1fr));gap:15px;align-items:start}
#lout{text-align:center}
.final{text-align:center;margin-top:25px}
#music{position:fixed;right:10px;bottom:10px;z-index:150;background:#fffaf0;padding:8px;border-radius:20px;box-shadow:2px 3px #0002;display:flex;gap:8px;align-items:center}
#music button{border:0;background:var(--wine);color:white;border-radius:50%;width:32px;height:32px}
.rv{opacity:0;transform:translateY(12px);transition:.7s}
.rv.in{opacity:1;transform:none}
footer{text-align:center;padding:30px 10px 70px}

/* JAR */
.jarwrap{text-align:center}
.jar{position:relative;display:block;width:150px;height:170px;margin:34px auto 12px;padding:0;border:4px solid #d9b9a9;border-radius:18px 18px 44px 44px;background:#fff8f0}
.jar::before{content:"";position:absolute;left:-10px;right:-10px;top:-24px;height:20px;border-radius:8px;background:var(--rose)}
.jar i{position:absolute;width:44px;height:30px;border-radius:3px;box-shadow:1px 2px #0002}
.jar.wig{animation:wig .5s}
@keyframes wig{0%,100%{transform:rotate(0)}25%{transform:rotate(-6deg)}75%{transform:rotate(6deg)}}
#jnote{max-width:460px;margin:16px auto;text-align:center}

@keyframes pop{to{transform:translate(var(--x),var(--y)) rotate(var(--r));opacity:0}}
@media(max-width:600px){
 section{padding:45px 17px 20px}
}
@media(prefers-reduced-motion:reduce){
 *,*::before,*::after{scroll-behavior:auto!important;transition:none!important;animation:none!important}
 .rv{opacity:1;transform:none}
}
</style>
</head>

<body>
<div id="bar"></div>
<header id="gate"><div id="gateInner"></div></header>
<main id="main" class="hidden"></main>
<div id="music" class="hidden">
 <button id="mbtn" aria-label="Play or pause music">▶</button>
 <input id="vol" type="range" min="0" max="1" step=".05" value=".5" aria-label="Volume">
</div>

 <button class="btn ghost" id="replay">Replay the opening</button>
</footer>

/* ==================================================
   WEBSITE ENGINE — PERSONAL CONTENT IS ABOVE
================================================== */
const $=(s,r=document)=>r.querySelector(s);
const el=(tag,cls,html)=>{
 const e=document.createElement(tag);
 if(cls)e.className=cls;
 if(html!==undefined)e.innerHTML=html;
 return e;
};
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({
 "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"
}[c]));
const arr=a=>Array.isArray(a)?a:[];
const C=CONFIG,main=$("#main");
const noMotion=matchMedia("(prefers-reduced-motion: reduce)").matches;
document.title=C.title||"For you";

function media(src,cls,label){
 const placeholder=()=>{
  const p=el("div","ph","Add image: "+esc(src||label||"photo.jpg"));
  return p;
 };
 if(!src)return placeholder();
 const img=new Image();
 img.src=src;img.alt=label||"";
 if(cls)img.className=cls;
 img.onerror=()=>img.replaceWith(placeholder());
 return img;
}

function envelope(label,paperHTML,big,seal){
 const w=el("div","ew"+(big?" big":""));
 const b=el("button","env",
  '<span class="flap"></span><span class="seal">'+esc(seal||"♥")+'</span><span class="lab">'+esc(label)+'</span>');
 b.type="button";b.setAttribute("aria-expanded","false");
 const n=el("div","note",'<div><div class="paper">'+paperHTML+'</div></div>');
 b.addEventListener("click",()=>{
  const open=b.classList.toggle("open");
  b.setAttribute("aria-expanded",String(open));
 });
 w.append(b,n);
 w.toggle=()=>b.click();
 return w;
}

function sec(id,title,sub){
 const s=el("section");s.id=id;
 if(C.effects.reveal)s.classList.add("rv");
 s.append(el("h2",null,esc(title)));
 if(sub)s.append(el("p","sub",esc(sub)));
 main.append(s);
 return s;
}

function buildGate(){
 const g=C.gate,box=$("#gateInner");
 box.innerHTML="";
 box.append(el("p","greet",esc(g.greeting)));
 box.append(el("p",null,esc(g.line)));

 const e=envelope("For "+C.partnerName,esc(g.letter),true,"♥");
 const go=el("button","btn",esc(g.button));
 go.type="button";go.style.display="none";

 const env=e.querySelector(".env");
 env.addEventListener("click",()=>{
  go.style.display=env.classList.contains("open")?"inline-block":"none";
 });

 go.addEventListener("click",()=>{
  $("#gate").classList.add("hidden");
  main.classList.remove("hidden");
  $("#foot").classList.remove("hidden");
  if(C.music.src)$("#music").classList.remove("hidden");
  scrollTo(0,0);observe();
 });

 box.append(e,go);
}

function buildStory(){
 const items=arr(C.timeline);
 const s=sec("story","Our first year","Tap a memory to read it.");
 const cnt=el("p","count");
 const tl=el("div","tl");
 let seen=0;
 const upd=()=>cnt.textContent="Memories opened: "+seen+" of "+items.length;

 items.forEach(m=>{
  const d=el("div","ms "+(m.size==="big"?"big":"small"));
  d.append(el("div","date",esc(m.date)),el("h3",null,esc(m.title)));
  if(m.size==="big"&&m.photo)d.append(media(m.photo,"pic","Memory photo"));
  const st=el("p","story",esc(m.story));
  const b=el("button","btn ghost","Read this one");
  b.type="button";
  let first=true;
  b.onclick=()=>{
   const open=st.classList.toggle("show");
   b.textContent=open?"Fold it back":"Read this one";
   if(open&&first){first=false;seen++;upd()}
  };
  d.append(b,st);tl.append(d);
 });
 upd();s.append(cnt,tl);
}

function buildLetter(){
 const L=C.loveLetter,s=sec("letter","A letter");
 const html=esc(L.greeting)+"\n\n"+esc(L.body)+"\n\n"+esc(L.closing)+
  '<span class="sig">'+esc(L.signature)+'</span>';
 const e=envelope(L.label,html,true,"♥");
 s.append(e);
 const b=el("button","btn ghost","Close and open again");
 b.type="button";b.onclick=()=>e.toggle();s.append(b);
}

/* Interactive flower illustrations */
const PET={
 daisy:["#fff","#f2c230",8],
 sunflower:["#f4b92c","#6b4423",12],
 poppy:["#d9382f","#2b1b17",5],
 rose:["#a3243d","#7a1730",7],
 tulip:["#e98aa7","#c4568a",3]
};

function flowerSVG(type){
 const p=PET[type]||PET.daisy;
 let petals="";
 if(type==="tulip"){
  petals='<path d="M18 36 Q16 12 30 10 Q44 12 42 36 Q30 44 18 36Z" fill="'+p[0]+'"/>';
 }else{
  for(let i=0;i<p[2];i++){
   petals+='<ellipse cx="30" cy="16" rx="5" ry="11" fill="'+p[0]+'" transform="rotate('+(360/p[2]*i)+' 30 30)"/>';
  }
  petals+='<circle cx="30" cy="30" r="6" fill="'+p[1]+'"/>';
 }
 return '<svg viewBox="0 0 60 120" aria-hidden="true"><path d="M30 44 Q27 80 30 120" stroke="#5f8a4f" stroke-width="3" fill="none"/><path d="M30 90 Q12 78 10 66 Q26 70 30 90Z" fill="#6f9a5c"/>'+petals+'</svg>';
}

/* GARDEN: plant every seed, then tap a flower to read what it says. */
function buildGarden(){
 const flowers=arr(C.flowers),total=flowers.length;
 const section=sec("garden","Growing with you","Plant each seed. Every flower is something I love about you.");
 const bed=el("div");bed.id="bed";
 const counter=el("p","count");
 const note=el("div");note.id="gnote";note.setAttribute("aria-live","polite");
 const intro=total?"Tap a seed to plant it. \uD83C\uDF31":"Add flowers to CONFIG.flowers to start your garden.";
 let discovered=0,selected=null;
 const plants=[];
 const updateCount=()=>{counter.textContent="Flowers discovered: "+discovered+" of "+total};
 note.textContent=intro;updateCount();

 flowers.forEach((flower,i)=>{
  const b=el("button","plant",'<span class="stage">'+flowerSVG(flower.type)+'</span><span class="mound"><span class="seed"></span></span><span class="tag">Seed '+(i+1)+'</span>');
  const tag=b.querySelector(".tag");
  b.type="button";
  b.style.marginTop=(i%2?16:0)+"px";            // slightly uneven, like a real garden
  b.setAttribute("aria-label","Seed "+(i+1)+": tap to plant it");
  b.addEventListener("click",()=>{
   b.classList.add("grown");
   if(selected&&selected!==b)selected.classList.remove("sel");
   b.classList.add("sel");selected=b;
   tag.textContent=flower.title;
   note.replaceChildren(el("h3",null,esc(flower.title)),el("p",null,esc(flower.message)));
   if(!b.dataset.seen){b.dataset.seen="1";discovered++;updateCount()}
   b.setAttribute("aria-label",flower.title+": tap to read again");
   if(discovered===total)note.append(el("p",null,"You found every flower. \u2665"));
  });
  bed.append(b);plants.push(b);
 });

 const again=el("button","btn ghost","Replant the garden");
 again.type="button";
 again.addEventListener("click",()=>{
  plants.forEach((p,i)=>{p.classList.remove("grown","sel");delete p.dataset.seen;
   p.querySelector(".tag").textContent="Seed "+(i+1);p.setAttribute("aria-label","Seed "+(i+1)+": tap to plant it")});
  discovered=0;selected=null;updateCount();note.textContent=intro;
 });
 section.append(bed,counter,note);
 if(total)section.append(again);
}

function confetti(container){
 const colors=["#c4808a","#e9c5c2","#7a2338","#e0b24a"];
 for(let i=0;i<22;i++){
  const bit=el("span");
  bit.style.cssText=
   "position:absolute;left:50%;top:150px;width:9px;height:12px;"+
   "background:"+colors[i%4]+";pointer-events:none;animation:pop 1.6s forwards;"+
   "--x:"+((Math.random()-.5)*300)+"px;--y:"+(-80-Math.random()*130)+"px;"+
   "--r:"+Math.random()*540+"deg";
  container.append(bit);
  setTimeout(()=>bit.remove(),1700);
 }
}

function buildGift(){
 const list=arr(C.surprises).filter(x=>x&&x.enabled);
 const s=sec("gift","One more thing");
 const w=el("div","giftwrap");
 const b=el("button","gift",'<span class="gbody"></span><span class="glid"></span>');
 b.type="button";b.setAttribute("aria-label","Open gift box");
 const tag=el("p","gtag",esc(C.giftNote));
 const out=el("div");out.id="gout";
 const reset=el("button","btn ghost","Close the box");
 reset.type="button";reset.style.display="none";
 let open=false;

 b.onclick=()=>{
  open=!open;b.classList.toggle("open",open);out.replaceChildren();
  if(open){
   if(C.effects.confetti&&!noMotion)confetti(w);
   list.forEach(x=>{
    const p=el("div","paper");
    p.append(el("b",null,esc(x.title)),el("p",null,esc(x.message)));
    if(x.image)p.prepend(media(x.image,"pic","Gift photo"));
    if(x.video){const v=el("video");v.src=x.video;v.controls=true;v.style.maxWidth="100%";p.append(v)}
    if(x.audio){const a=el("audio");a.src=x.audio;a.controls=true;p.append(a)}
    if(x.link){
     const l=el("a",null,"Open the playlist");
     l.href=x.link;l.target="_blank";l.rel="noopener";p.append(l);
    }
    out.append(p);
   });
   if(!list.length)out.append(el("p",null,"No surprises enabled yet."));
  }
  tag.textContent=open?"Look what's inside.":C.giftNote;
  reset.style.display=open?"inline-block":"none";
 };
 reset.onclick=()=>b.click();
 w.append(b,tag,out,reset);s.append(w);
}

let ci=0;
const photos=()=>arr(C.album.photos);

function lightbox(index){
 const ps=photos();if(!ps.length)return;
 ci=(index+ps.length)%ps.length;
 const p=ps[ci],lb=$("#lb");
 lb.replaceChildren();

 const inside=el("div","in");
 inside.append(media(p.src,"","Photo"));
 inside.append(el("p",null,"<b>"+esc(p.caption)+"</b> "+esc(p.date)));
 inside.append(el("p",null,esc(p.story)));

 const row=el("div","row");
 const prev=el("button","btn ghost","Previous");
 const next=el("button","btn ghost","Next");
 const close=el("button","btn","Close");

 prev.onclick=()=>lightbox(ci-1);
 next.onclick=()=>lightbox(ci+1);
 close.onclick=closeLb;
 row.append(prev,close,next);inside.append(row);
 lb.append(inside);lb.classList.remove("hidden");close.focus();
}
function closeLb(){$("#lb").classList.add("hidden")}
$("#lb").addEventListener("click",e=>{if(e.target.id==="lb")closeLb()});
addEventListener("keydown",e=>{
 if($("#lb").classList.contains("hidden"))return;
 if(e.key==="Escape")closeLb();
 if(e.key==="ArrowRight")lightbox(ci+1);
 if(e.key==="ArrowLeft")lightbox(ci-1);
});

function buildAlbum(){
 const s=sec("album","Our little photo album","Tap a polaroid for the story.");
 const a=el("div","alb");
 photos().forEach((p,i)=>{
  const b=el("button","pol");
  b.type="button";
  b.append(media(p.src,"","Photo"),el("span",null,esc(p.caption)));
  b.style.transform="rotate("+(((i*7)%9)-4)+"deg)";
  b.onclick=()=>lightbox(i);
  a.append(b);
 });
 s.append(a);

 const v=C.album.video;
 if(v&&v.src){
  s.append(el("p",null,esc(v.caption)));
  const vi=el("video");vi.src=v.src;vi.controls=true;
  vi.style.maxWidth="100%";s.append(vi);
 }
}

function buildOpenWhen(){
 const s=sec("openwhen","Open when…");
 const g=el("div","ow");
 arr(C.openWhen).forEach(o=>g.append(envelope(o.label,esc(o.note),false,"♥")));
 s.append(g);
}

function buildLoves(){
 const s=sec("loves","Things I love about you","Tap a little note.");
 const w=el("div","scraps"),out=el("div","paper");
 out.id="lout";out.textContent="Pick one.";
 const colors=["#fff3b8","#fadadd","#e4efe0","#e7e1f3","#fde5cf"];
 let current=null;

 arr(C.loves).forEach((text,index)=>{
  const b=el("button","scrap","No. "+(index+1));
  b.type="button";
  b.style.background=colors[index%colors.length];
  b.style.transform="rotate("+(((index*5)%9)-4)+"deg)";
  b.onclick=()=>{
   if(current)current.classList.remove("on");
   b.classList.add("on");current=b;out.textContent=text;
  };
  w.append(b);
 });
 s.append(w,out);
}

function buildJar(){
 const J=C.jar,notes=arr(J.notes),s=sec("jar",J.title,J.sub);
 const wrap=el("div","jarwrap");
 const jar=el("button","jar");jar.type="button";jar.setAttribute("aria-label",J.button);
 const cols=["#fff3b8","#fadadd","#e4efe0","#e7e1f3","#fde5cf","#fff3b8"];
 for(let i=0;i<6;i++){
  const p=el("i");
  p.style.cssText="background:"+cols[i]+";left:"+(8+(i%3)*30)+"px;bottom:"+(8+Math.floor(i/3)*28)+"px;transform:rotate("+(((i*47)%40)-20)+"deg)";
  jar.append(p);
 }
 const out=el("div","paper");out.id="jnote";
 out.textContent=notes.length?"Tap the jar. No peeking!":"Add notes to CONFIG.jar.notes.";
 const btn=el("button","btn",esc(J.button));btn.type="button";
 let last=-1;
 const pull=()=>{
  if(!notes.length)return;
  let n;do{n=Math.floor(Math.random()*notes.length)}while(notes.length>1&&n===last);
  last=n;out.textContent=notes[n];
  jar.classList.remove("wig");void jar.offsetWidth;if(!noMotion)jar.classList.add("wig");
  btn.textContent="Pull another";
 };
 jar.onclick=pull;btn.onclick=pull;
 wrap.append(jar,btn,out);s.append(wrap);
}

function buildNext(){
 const n=C.next,s=sec("next","Our next chapter");
 s.append(el("p",null,esc(n.message)));
 const g=el("div","ow");
 arr(n.promises).forEach(p=>g.append(envelope(p.label,esc(p.note),false,"★")));
 s.append(g);

 const f=el("div","final");
 const b=el("button","btn",esc(n.buttonText));
 const out=el("div","paper");
 out.classList.add("hidden");out.textContent=n.finalMessage;
 const restartButton=el("button","btn ghost","Back to the beginning");
 b.onclick=()=>{
  out.classList.toggle("hidden");
  if(!out.classList.contains("hidden")&&C.effects.confetti&&!noMotion)confetti(f);
 };
 restartButton.onclick=restart;
 f.append(b,out,restartButton);s.append(f);
}

function buildMusic(){
 const audio=new Audio();audio.loop=true;
 const btn=$("#mbtn"),volume=$("#vol");
 if(!C.music.src)return;
 audio.src=C.music.src;audio.volume=C.music.startVolume;
 volume.value=audio.volume;
 btn.onclick=()=>{
  if(audio.paused){
   audio.play().then(()=>btn.textContent="Ⅱ").catch(()=>{btn.title="Check your audio file path"});
  }else{audio.pause();btn.textContent="▶"}
 };
 volume.oninput=()=>audio.volume=Number(volume.value);
 btn.title=C.music.title;
}

function observe(){
 if(!("IntersectionObserver" in window)){
  document.querySelectorAll(".rv").forEach(x=>x.classList.add("in"));return;
 }
 const io=new IntersectionObserver(entries=>{
  entries.forEach(e=>{
   if(e.isIntersecting){e.target.classList.add("in");io.unobserve(e.target)}
  });
 },{threshold:.08});
 document.querySelectorAll(".rv").forEach(x=>io.observe(x));
}

addEventListener("scroll",()=>{
 const h=document.documentElement;
 $("#bar").style.width=(h.scrollTop/(h.scrollHeight-h.clientHeight||1)*100)+"%";
},{passive:true});

function restart(){
 main.classList.add("hidden");
 $("#foot").classList.add("hidden");
 buildGate();
 $("#gate").classList.remove("hidden");
 scrollTo(0,0);
}
$("#replay").onclick=restart;

const BUILDERS={
 story:buildStory,letter:buildLetter,garden:buildGarden,gift:buildGift,
 album:buildAlbum,openWhen:buildOpenWhen,loves:buildLoves,
 jar:buildJar,next:buildNext
};

Object.keys(BUILDERS).forEach(key=>{
 if(CONFIG.show[key]!==false){
  try{BUILDERS[key]()}
  catch(error){console.error("Section error:",key,error)}
 }
});

buildGate();
buildMusic();
</script>
