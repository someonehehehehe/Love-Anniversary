
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>A Year of Us ❤️</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gaegu:wght@400;700&display=swap">
<style>
:root {
  --paper:#f6ecdd; --blush:#e9c5c2; --rose:#c4808a;
  --wine:#7a2338; --brown:#5b4236; --ink:#4a362c;
  --hand:"Gaegu","Comic Sans MS",cursive;
}
*{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink);font:17px/1.65 Georgia,serif;overflow-x:hidden}
h2{font:700 2.2rem var(--hand);color:var(--wine)}
h3{font:700 1.5rem var(--hand)}
button{font:inherit;cursor:pointer;color:inherit}
button:focus-visible{outline:3px solid var(--wine)}
.hidden{display:none!important}
#bar{position:fixed;top:0;left:0;height:4px;background:var(--rose);z-index:50;width:0}
#gate{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px;text-align:center}
.greet{font:700 2rem var(--hand);color:var(--wine)}
section{max-width:860px;margin:auto;padding:4rem 20px 2rem}
.sub{opacity:.75;font-style:italic;margin-bottom:1.5rem}
.btn{background:var(--wine);color:#fff7ef;border:0;padding:10px 20px;border-radius:5px 12px;font:1.2rem var(--hand);margin:5px}
.ghost{background:transparent;color:var(--wine);border:1px dashed var(--wine)}
.ew{width:min(320px,100%);margin:20px auto}
.ew.big{width:min(420px,100%)}
.env{position:relative;width:100%;height:140px;border:0;background:linear-gradient(var(--blush),#dcaeb0);box-shadow:3px 5px #5b423622}
.big .env{height:200px}
.flap{position:absolute;inset:0 0 auto;height:62%;background:#d79ea5;clip-path:polygon(0 0,100% 0,50% 100%);transform-origin:top;transition:transform .7s}
.env.open .flap{transform:rotateX(180deg)}
.seal{position:absolute;left:50%;top:48%;border-radius:50%;background:var(--wine);color:white;padding:5px 10px;transform:translateX(-50%)}
.env.open .seal{opacity:0}
.lab{position:absolute;bottom:10px;left:0;width:100%;font:1.3rem var(--hand)}
.note{display:grid;grid-template-rows:0fr;transition:grid-template-rows .6s}
.env.open+.note{grid-template-rows:1fr}
.note>div{overflow:hidden;min-height:0}
.paper{margin-top:10px;padding:20px;background:#fffaf0 repeating-linear-gradient(transparent 0 29px,#c4808a33 29px 30px);font:1.3rem/30px var(--hand);white-space:pre-line;box-shadow:2px 3px #5b423622;opacity:0;transition:opacity .5s}
.env.open+.note .paper{opacity:1}
.sig{text-align:right;color:var(--wine)}
.tl{border-left:2px dashed var(--rose);padding-left:22px}
.ms{position:relative;margin-bottom:30px;padding:15px;background:#fffaf0;box-shadow:2px 4px #5b423622}
.ms:before{content:"♥";position:absolute;left:-28px;color:var(--wine)}
.ms.small{max-width:300px;background:#fff3b8;transform:rotate(-1deg)}
.date{font:.95rem var(--hand);color:var(--rose)}
.story{display:none}.story.show{display:block}
.pic{width:100%;max-height:260px;object-fit:cover;display:block;margin:10px 0}
.ph{display:flex;align-items:center;justify-content:center;text-align:center;min-height:150px;padding:10px;border:2px dashed var(--rose);background:#f3e3d6;font:1rem var(--hand)}
.count{font:1rem var(--hand)}
#garden{position:relative;height:250px;background:linear-gradient(#fbeee8 0 70%,#7a5640 70%);border-radius:8px;overflow:hidden}
.pl{position:absolute;bottom:20px;border:0;background:none;padding:0;transform-origin:bottom}
.pl svg{width:100%;height:auto;transform:scaleY(0);transition:transform 1s}
.pl.grown svg{transform:scaleY(1)}
.seed{position:absolute;bottom:0;left:40%;width:22px;height:11px;border-radius:50%;background:#5a3b2a}
.pl.grown .seed{opacity:0}
#gnote{min-height:5rem}
.giftwrap{text-align:center;min-height:310px;position:relative}
.gift{position:relative;width:170px;height:150px;margin:60px auto 0;border:0;background:none}
.gbody{position:absolute;bottom:0;left:0;right:0;height:100px;background:var(--rose)}
.gbody:after,.glid:after{content:"";position:absolute;left:43%;width:26px;height:100%;background:var(--wine)}
.glid{position:absolute;bottom:100px;left:-8px;right:-8px;height:34px;background:#d58f98;transition:transform .7s}
.glid:before{content:"";position:absolute;left:40%;top:-18px;width:36px;height:20px;border:6px solid var(--wine);border-radius:50%}
.gift.open .glid{transform:translate(-30px,-60px) rotate(-28deg)}
.gtag{font:1.2rem var(--hand);color:var(--wine)}
#gout{max-width:420px;margin:auto}
.alb{display:flex;flex-wrap:wrap;gap:22px;justify-content:center}
.pol{width:190px;background:white;padding:10px;border:0;box-shadow:2px 4px 8px #0003;transition:transform .2s}
.pol img,.pol .ph{height:170px;width:100%;object-fit:cover}
.pol span{display:block;font:1rem var(--hand);margin-top:6px}
#lb{position:fixed;inset:0;background:#3c231ee8;z-index:60;display:flex;align-items:center;justify-content:center;padding:15px}
#lb .in{background:#fffaf0;max-width:520px;width:100%;max-height:92vh;overflow:auto;padding:15px;text-align:center}
#lb img{max-width:100%;max-height:52vh;object-fit:contain}
.row{display:flex;justify-content:space-between;gap:5px}
.scraps{display:flex;flex-wrap:wrap;gap:10px;justify-content:center}
.scrap{border:0;padding:12px;font:1.2rem var(--hand);box-shadow:2px 2px #0002}
.scrap.on{outline:2px solid var(--wine)}
.ow{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:15px;align-items:start}
#lout{min-height:5rem;text-align:center}
.clock{display:flex;gap:20px;justify-content:center;font:1.2rem var(--hand);flex-wrap:wrap}
.clock b{font-size:1.7rem;color:var(--wine)}
.final{text-align:center;margin-top:25px}
#music{position:fixed;right:10px;bottom:10px;z-index:55;background:#fffaf0;padding:8px;border-radius:20px;box-shadow:2px 3px #0002;display:flex;gap:8px;align-items:center}
#music button{border:0;background:var(--wine);color:white;border-radius:50%;width:32px;height:32px}
footer{text-align:center;padding:30px 10px 70px}
.rv{opacity:0;transform:translateY(12px);transition:.7s}
.rv.in{opacity:1;transform:none}
@media(prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}.rv{opacity:1;transform:none}}
</style>
</head>
<body>

<header id="gate"><div id="gateInner"></div></header>

<script>

/* WEBSITE ENGINE — no need to edit below this line */
const $=(s,r=document)=>r.querySelector(s);
const el=(t,c,h)=>{const e=document.createElement(t);if(c)e.className=c;if(h!=null)e.innerHTML=h;return e};
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const arr=a=>Array.isArray(a)?a:[];
const C=CONFIG,main=$("#main");
const noMotion=matchMedia("(prefers-reduced-motion: reduce)").matches;
document.title=C.title||"For you";

function media(src,cls,label){
  const ph=()=>el("div","ph","Add image: "+esc(src||label||"photo.jpg"));
  if(!src)return ph();
  const i=new Image();i.src=src;i.alt=label||"";if(cls)i.className=cls;
  i.onerror=()=>i.replaceWith(ph());return i;
}
function envelope(label,paperHTML,big,seal){
  const w=el("div","ew"+(big?" big":""));
  const b=el("button","env",'<span class="flap"></span><span class="seal">'+esc(seal||"♥")+'</span><span class="lab">'+esc(label)+'</span>');
  b.setAttribute("aria-expanded","false");
  const n=el("div","note",'<div><div class="paper">'+paperHTML+'</div></div>');
  b.onclick=()=>{const o=b.classList.toggle("open");b.setAttribute("aria-expanded",o)};
  w.append(b,n);w.toggle=()=>b.click();return w;
}
function sec(id,title,sub){
  const s=el("section");s.id=id;if(C.effects.reveal)s.classList.add("rv");
  s.append(el("h2",null,esc(title)));if(sub)s.append(el("p","sub",esc(sub)));main.append(s);return s;
}
function buildGate(){
  const g=C.gate,box=$("#gateInner");box.innerHTML="";
  box.append(el("p","greet",esc(g.greeting)),el("p",null,esc(g.line)));
  const e=envelope("For "+C.partnerName,esc(g.letter),true,"♥");
  const go=el("button","btn",esc(g.button));go.style.display="none";
  e.querySelector=undefined;
  const env=e.querySelector;
  const btn=e.firstChild;
  btn.onclick=()=>{const o=btn.classList.toggle("open");btn.setAttribute("aria-expanded",o);go.style.display=o?"inline-block":"none"};
  go.onclick=()=>{$("#gate").classList.add("hidden");main.classList.remove("hidden");$("#foot").classList.remove("hidden");if(C.music.src)$("#music").classList.remove("hidden");scrollTo(0,0);observe()};
  box.append(e,go);
}
function buildStory(){
  const items=arr(C.timeline),s=sec("story","Our first year","Tap a memory to read it."),cnt=el("p","count"),tl=el("div","tl");let seen=0;
  const upd=()=>cnt.textContent="Memories opened: "+seen+" of "+items.length;
  items.forEach(m=>{
    const d=el("div","ms "+(m.size==="big"?"big":"small"));
    d.append(el("div","date",esc(m.date)),el("h3",null,esc(m.title)));
    if(m.size==="big"&&m.photo)d.append(media(m.photo,"pic","Memory photo"));
    const st=el("p","story",esc(m.story)),b=el("button","btn ghost","Read this one");let first=true;
    b.onclick=()=>{const o=st.classList.toggle("show");b.textContent=o?"Fold it back":"Read this one";if(o&&first){first=false;seen++;upd()}};
    d.append(b,st);tl.append(d);
  });upd();s.append(cnt,tl);
}
function buildLetter(){
  const L=C.loveLetter,s=sec("letter","A letter");
  const html=esc(L.greeting)+"\n\n"+esc(L.body)+"\n\n"+esc(L.closing)+'\n<span class="sig" style="display:block">'+esc(L.signature)+"</span>";
  const e=envelope(L.label,html,true,"♥");s.append(e);
  const b=el("button","btn ghost","Close and open again");b.onclick=()=>e.toggle();s.append(b);
}
const PET={daisy:["#fff","#f2c230",8],sunflower:["#f4b92c","#6b4423",12],poppy:["#d9382f","#2b1b17",5],rose:["#a3243d","#7a1730",7],tulip:["#e98aa7","#c4568a",3]};
function flowerSVG(t){
  const p=PET[t]||PET.daisy;let g="";
  if(t==="tulip")g='<path d="M18 36 Q16 12 30 10 Q44 12 42 36 Q30 44 18 36Z" fill="'+p[0]+'"/>';
  else{for(let i=0;i<p[2];i++)g+='<ellipse cx="30" cy="16" rx="5" ry="11" fill="'+p[0]+'" transform="rotate('+(360/p[2]*i)+' 30 30)"/>';g+='<circle cx="30" cy="30" r="6" fill="'+p[1]+'"/>'}
  return '<svg viewBox="0 0 60 120" aria-hidden="true"><path d="M30 44 Q27 80 30 120" stroke="#5f8a4f" stroke-width="3" fill="none"/><path d="M30 90 Q12 78 10 66 Q26 70 30 90Z" fill="#6f9a5c"/>'+g+'</svg>';
}
function buildGarden(){
  const f=arr(C.flowers),s=sec("garden","Growing with you","Tap a seed to plant it. Tap the flower to read its message.");
  const g=el("div");g.id="garden";const note=el("div","paper");note.id="gnote";note.style.opacity=1;note.textContent="Nothing planted yet.";
  let found=0;const total=f.length,cnt=el("p","count","Flowers read: 0 of "+total);
  f.forEach((fl,i)=>{
    const w=60+((i*37)%24),left=(i+.5)/Math.max(total,1)*100;
    const b=el("button","pl",'<span class="seed"></span>'+flowerSVG(fl.type));
    b.setAttribute("aria-label",fl.title+" seed");
    b.style.cssText="left:calc("+left+"% - "+(w/2)+"px);width:"+w+"px;height:"+(w*2)+"px;transform:rotate("+(((i*53)%9)-4)+"deg)";
    let grown=false,seen=false;
    b.onclick=()=>{
      if(!grown){grown=true;b.classList.add("grown");return}
      note.innerHTML="<b>"+esc(fl.title)+"</b>\n"+esc(fl.message);
      if(!seen){seen=true;found++;cnt.textContent="Flowers read: "+found+" of "+total}
      if(found===total)note.innerHTML+="\n\nYou found every flower. ♥";
    };g.append(b);
  });
  s.append(g,cnt,note);
}
function confetti(w){
  const cols=["#c4808a","#e9c5c2","#7a2338","#e0b24a"];
  for(let i=0;i<22;i++){
    const c=el("span");c.style.cssText="position:absolute;left:50%;top:150px;width:9px;height:12px;background:"+cols[i%4]+";pointer-events:none;animation:pop 1.6s forwards;--x:"+(Math.random()-.5)*300+"px;--y:"+(-80-Math.random()*130)+"px;--r:"+Math.random()*540+"deg";
    w.append(c);setTimeout(()=>c.remove(),1700);
  }
}
function buildGift(){
  const list=arr(C.surprises).filter(x=>x&&x.enabled),s=sec("gift","One more thing"),w=el("div","giftwrap");
  const b=el("button","gift",'<span class="gbody"></span><span class="glid"></span>');b.setAttribute("aria-label","Gift box");
  const tag=el("p","gtag",esc(C.giftNote)),out=el("div");out.id="gout";let open=false;
  const reset=el("button","btn ghost","Close the box");reset.style.display="none";
  b.onclick=()=>{
    open=!open;b.classList.toggle("open",open);out.innerHTML="";
    if(open){
      if(C.effects.confetti&&!noMotion)confetti(w);
      list.forEach(x=>{
        const p=el("div","paper","<b>"+esc(x.title)+"</b>\n"+esc(x.message));p.style.opacity=1;
        if(x.image)p.prepend(media(x.image,"pic","Gift photo"));
        if(x.video){const v=el("video");v.src=x.video;v.controls=true;p.append(v)}
        if(x.audio){const a=el("audio");a.src=x.audio;a.controls=true;p.append(a)}
        if(x.link){const l=el("a",null,"Open the playlist");l.href=x.link;l.target="_blank";l.rel="noopener";p.append(l)}
        out.append(p);
      });
      if(!list.length)out.append(el("p",null,"No surprises enabled yet."));
    }
    tag.textContent=open?"Look what's inside.":C.giftNote;reset.style.display=open?"inline-block":"none";
  };
  reset.onclick=()=>b.click();w.append(b,tag,out,reset);s.append(w);
}
let ci=0;const P=()=>arr(C.album.photos);
function lightbox(i){
  const ps=P();if(!ps.length)return;ci=(i+ps.length)%ps.length;const p=ps[ci],lb=$("#lb");lb.innerHTML="";
  const inside=el("div","in");inside.append(media(p.src,"","Photo"),el("p","hand","<b>"+esc(p.caption)+"</b> "+esc(p.date)),el("p",null,esc(p.story)));
  const row=el("div","row"),prev=el("button","btn ghost","Previous"),next=el("button","btn ghost","Next"),close=el("button","btn","Close");
  prev.onclick=()=>lightbox(ci-1);next.onclick=()=>lightbox(ci+1);close.onclick=closeLb;
  row.append(prev,close,next);inside.append(row);lb.append(inside);lb.classList.remove("hidden");close.focus();
}
function closeLb(){$("#lb").classList.add("hidden")}
$("#lb").addEventListener("click",e=>{if(e.target.id==="lb")closeLb()});
addEventListener("keydown",e=>{if($("#lb").classList.contains("hidden"))return;if(e.key==="Escape")closeLb();if(e.key==="ArrowRight")lightbox(ci+1);if(e.key==="ArrowLeft")lightbox(ci-1)});
function buildAlbum(){
  const s=sec("album","Our little photo album","Tap a polaroid for the story."),a=el("div","alb");
  P().forEach((p,i)=>{const b=el("button","pol");b.append(media(p.src,"","Photo"),el("span",null,esc(p.caption)));b.style.transform="rotate("+(((i*7)%9)-4)+"deg)";b.onclick=()=>lightbox(i);a.append(b)});
  s.append(a);const v=C.album.video;
  if(v&&v.src){const vi=el("video");vi.src=v.src;vi.controls=true;s.append(el("p","hand",esc(v.caption)),vi)}
}
function buildOpenWhen(){
  const s=sec("openwhen","Open when…"),g=el("div","ow");
  arr(C.openWhen).forEach(o=>g.append(envelope(o.label,esc(o.note),false,"♥")));s.append(g);
}
function buildLoves(){
  const s=sec("loves","Things I love about you","Tap a little note.");
  const w=el("div","scraps"),out=el("div","paper");out.id="lout";out.style.opacity=1;out.textContent="Pick one.";
  const cols=["#fff3b8","#fadadd","#e4efe0","#e7e1f3","#fde5cf"];let cur=null;
  arr(C.loves).forEach((t,i)=>{
    const b=el("button","scrap","No. "+(i+1));b.style.background=cols[i%5];b.style.transform="rotate("+(((i*5)%9)-4)+"deg)";
    b.onclick=()=>{if(cur)cur.classList.remove("on");b.classList.add("on");cur=b;out.textContent=t};w.append(b);
  });s.append(w,out);
}
function buildCounter(){
  const s=sec("counter","Time so far"),c=el("div","clock");s.append(c);
  const d=new Date(C.anniversaryDate);
  if(!C.anniversaryDate||isNaN(d)){c.textContent="Set the anniversary date in CONFIG.";return}
  const tick=()=>{
    const ms=Date.now()-d;if(ms<0){c.textContent="It starts on "+d.toLocaleDateString();return}
    const t=Math.floor(ms/1000),dd=Math.floor(t/86400),h=Math.floor(t%86400/3600),m=Math.floor(t%3600/60),sc=t%60;
    c.innerHTML="<span><b>"+dd+"</b> days</span><span><b>"+h+"</b> hours</span><span><b>"+m+"</b> minutes</span><span><b>"+sc+"</b> seconds</span>";
  };tick();setInterval(tick,1000);
}
function buildNext(){
  const N=C.next,s=sec("next","Our next chapter");s.append(el("p",null,esc(N.message)));
  const g=el("div","ow");arr(N.promises).forEach(p=>g.append(envelope(p.label,esc(p.note),false,"★")));s.append(g);
  const f=el("div","final"),b=el("button","btn",esc(N.buttonText)),out=el("div","paper");
  out.id="fin";out.style.opacity=1;out.classList.add("hidden");out.textContent=N.finalMessage;
  b.onclick=()=>{out.classList.toggle("hidden");if(!out.classList.contains("hidden")&&C.effects.confetti&&!noMotion)confetti(f)};
  const r=el("button","btn ghost","Back to the beginning");r.onclick=restart;f.append(b,out,r);s.append(f);
}
function buildMusic(){
  const a=new Audio();a.loop=true;const btn=$("#mbtn"),vol=$("#vol");
  if(!C.music.src)return;a.src=C.music.src;a.volume=C.music.startVolume;vol.value=a.volume;
  btn.onclick=()=>{if(a.paused)a.play().then(()=>btn.textContent="Ⅱ").catch(()=>{btn.title="Audio file not found"});else{a.pause();btn.textContent="▶"}};
  vol.oninput=()=>a.volume=Number(vol.value);btn.title=C.music.title;
}
function observe(){
  const io=new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting){e.target.classList.add("in");io.unobserve(e.target)}}),{threshold:.08});
  document.querySelectorAll(".rv").forEach(x=>io.observe(x));
}
addEventListener("scroll",()=>{
  const h=document.documentElement;$("#bar").style.width=(h.scrollTop/(h.scrollHeight-h.clientHeight||1)*100)+"%";
},{passive:true});
function restart(){main.classList.add("hidden");$("#foot").classList.add("hidden");buildGate();$("#gate").classList.remove("hidden");scrollTo(0,0)}
$("#replay").onclick=restart;

const SEC={story:buildStory,letter:buildLetter,garden:buildGarden,gift:buildGift,album:buildAlbum,openWhen:buildOpenWhen,loves:buildLoves,counter:buildCounter,next:buildNext};
Object.keys(SEC).forEach(k=>{if(C.show[k]!==false){try{SEC[k]()}catch(e){console.warn("Section "+k+" failed:",e)}}});
buildGate();buildMusic();
</script>
</body>
</html>
